<body class="toolkit-page toolkit-spellbook">
  <header class="topbar toolkit-header">
    <a class="brand toolkit-brand" href="./" aria-label="Forever Toolkit home">
      <img src="toolkit-logo.png" width="38" height="38" alt="">
      <strong>Forever Toolkit</strong>
    </a>
    <nav class="toolkit-nav" aria-label="Main navigation">
      <a href="./">Home</a><a href="talents.html">Talents</a>
      <a class="active" href="abilities.html" aria-current="page">Spellbook</a>
      <a href="raid.html">Raid</a><a href="analysis/">Analysis</a>
    </nav>
  </header>
  <main class="spellbook-page" id="main">
    <div class="spellbook-title"><h1>Spellbook</h1><span>WoW Forever</span></div>
    <div id="spell-classes" class="spell-classes" role="group" aria-label="Class"></div>
    <div class="spellbook-layout">
      <section id="spell-browser" class="spell-browser" aria-label="Browse spells" tabindex="-1">
        <div class="spell-toolbar">
          <div class="spell-search"><label class="sr-only" for="spell-search">Search spells</label><input id="spell-search" type="search" maxlength="120" placeholder="Search spells or IDs…" autocomplete="off"><button id="clear-search" type="button" aria-label="Clear search">×</button></div>
          <span id="spell-count" role="status"></span>
          <label class="spell-sort">Sort <select id="spell-sort" aria-label="Sort spells"><option value="level">Level</option><option value="name">Name</option></select></label>
        </div>
        <a class="spell-jump" href="#spell-detail">Selected spell &amp; ranks ↓</a>
        <div class="book-volume">
          <h2 id="book-title">Spells</h2>
          <div id="spell-specs" class="spell-specs" role="group" aria-label="Specialization"></div>
          <div id="spell-list" class="spell-list" aria-label="Spells" tabindex="0"></div>
          <nav class="book-pagination" aria-label="Spellbook pages"><button id="spells-previous" type="button" aria-label="Previous spellbook page">‹</button><span id="spell-page" role="status"></span><button id="spells-next" type="button" aria-label="Next spellbook page">›</button></nav>
        </div>
      </section>
      <aside id="spell-detail" class="spell-detail" aria-label="Selected spell" tabindex="-1">
        <a class="spell-jump" href="#spell-browser">Back to spells ↑</a>
        <p id="spell-detail-empty" hidden>Select a spell to see its ranks.</p>
        <div id="spell-detail-content">
          <div class="spell-detail-head"><img id="spell-icon" width="52" height="52" alt=""><div><h2 id="spell-name"></h2><p id="spell-category"></p></div></div>
          <p id="spell-rank-label" aria-live="polite"></p>
          <div id="rank-controls" class="rank-controls"><button id="rank-previous" type="button" aria-label="Previous rank">‹</button><div id="rank-buttons" class="rank-buttons" role="group" aria-label="Spell rank"></div><button id="rank-next" type="button" aria-label="Next rank">›</button></div>
          <dl id="spell-facts" class="spell-facts"></dl>
          <p id="spell-description"></p>
          <div class="spell-links"><a id="talent-link">Talent calculator →</a></div>
          <details class="source-details"><summary>Database reference</summary><p><span id="source-build"></span> · <span id="spell-id"></span></p><p id="source-note"></p></details>
        </div>
      </aside>
    </div>
    <noscript><p>Enable JavaScript to browse the local spell catalog.</p></noscript>
  </main>
  <footer class="spellbook-footer">Game artwork © Blizzard Entertainment.</footer>
  <script src="spellbook-data.js?v=1"></script>
  <script src="spellbook.js?v=1"></script>
  <script src="spellbook-ui.js?v=1"></script>
</body>
</html>
