<body class="toolkit-page toolkit-leveling">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar toolkit-header">
    <a class="brand toolkit-brand" href="./" aria-label="Forever Toolkit home"><img src="toolkit-logo.png" width="40" height="40" alt=""><strong>Forever Toolkit</strong></a>
    <nav class="toolkit-nav" aria-label="Main navigation"><a href="./">Home</a><a href="talents.html">Talents</a><a href="abilities.html">Spellbook</a><a href="raid.html">Raid</a><a href="analysis/">Analysis</a></nav>
  </header>
  <main id="main">
    <div class="leveling-heading"><div><h1>Dungeon-first leveling</h1><p>Alliance &amp; Horde · Levels 1–60</p></div><span class="badge">Private · Work in progress</span></div>
    <p id="message" role="status" aria-live="polite" hidden></p>
    <div id="review-banner" class="notice" hidden></div>
    <section class="character-bar" aria-label="Character controls">
      <label>Character<select id="characters"></select></label><button id="new-character" type="button">New character</button>
      <button id="edit-character" type="button" aria-expanded="false" aria-controls="setup">Character settings</button>
      <button id="export-progress" type="button">Export progress</button><button id="import-button" type="button">Import progress</button><input id="import-progress" type="file" accept="application/json,.json" hidden>
      <button id="share-route" type="button">Share route</button>
    </section>
    <form id="setup" class="setup" hidden>
      <label>Name<input id="character-name" maxlength="80" required autocomplete="off"></label>
      <label>Faction<select id="faction"><option>Horde</option><option>Alliance</option></select></label>
      <label>Race<select id="race"></select></label><label>Class<select id="game-class"></select></label>
      <label>Current level<input id="level" type="number" min="1" max="60" value="1" required></label>
      <fieldset id="professions"><legend>Professions</legend></fieldset>
      <div class="form-actions"><button type="submit">Save character</button><button id="cancel-setup" type="button">Cancel</button></div>
    </form>
    <div id="share-box" class="notice" hidden><label>Selections and chapter only—no character name or progress<input id="share-link" readonly></label></div>
    <section id="overview" class="overview" aria-label="Route progress"></section>
    <div class="leveling-layout">
      <aside class="itinerary"><h2>Itinerary</h2><label class="mobile-chapters">Chapter<select id="mobile-chapter"></select></label><label class="chapter-filter">Find a dungeon<input id="chapter-filter" type="search" placeholder="Name or region" autocomplete="off"></label><nav id="chapters" aria-label="Leveling chapters"></nav></aside>
      <div class="route-content"><section id="chapter" aria-live="polite"></section></div>
    </div>
    <details id="coverage"><summary>Quest coverage &amp; unresolved records</summary><div id="coverage-body"></div></details>
    <details id="evidence"><summary>Evidence, rules &amp; data versions</summary><div id="evidence-body"></div></details>
    <noscript>This guide needs JavaScript for local checklists. No account or game access is used.</noscript>
  </main>
  <footer>JVMES · Forever Toolkit</footer>
